<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>iPhone 18 — Beyond</title>

  <style>
    :root {
      --bg: #000000;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --blue: #2997ff;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background: #000;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Inter, Arial, sans-serif;
      letter-spacing: -0.025em;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -10;
      inset: 0;
      background:
        radial-gradient(circle at 50% 15%, #0c1a51 0%, transparent 35%),
        radial-gradient(circle at 80% 60%, #25053f 0%, transparent 42%),
        #000;
      transition: background 1.8s var(--ease);
    }

    body.camera-active::before {
      background:
        radial-gradient(circle at 50% 18%, #d6e7ff 0%, transparent 35%),
        radial-gradient(circle at 78% 65%, #b8c8ff 0%, transparent 42%),
        #f5f5f7;
    }

    body.thin-active::before {
      background:
        radial-gradient(circle at 50% 90%, #263e79 0%, transparent 45%),
        radial-gradient(circle at 20% 25%, #0a1228 0%, transparent 40%),
        #050507;
    }

    body.display-active::before {
      background:
        radial-gradient(circle at 45% 35%, #c8009f 0%, transparent 24%),
        radial-gradient(circle at 73% 55%, #004dff 0%, transparent 34%),
        radial-gradient(circle at 30% 80%, #00a58b 0%, transparent 38%),
        #03000a;
    }

    body.ai-active::before {
      background:
        radial-gradient(circle at 18% 70%, #ff4cbb 0%, transparent 33%),
        radial-gradient(circle at 82% 55%, #6741ff 0%, transparent 38%),
        #f5f5f7;
    }

    body.final-active::before {
      background:
        radial-gradient(circle at 50% 54%, #2d0e86 0%, transparent 31%),
        radial-gradient(circle at 74% 48%, #0059d4 0%, transparent 36%),
        #000;
    }

    ::selection {
      background: white;
      color: black;
    }

    .nav {
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100vw - 1120px) / 2));
      background: rgba(0, 0, 0, .52);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: white;
      line-height: 1;
      text-decoration: none;
    }

    .nav-title {
      color: #f5f5f7;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-button,
    .buy {
      border: 0;
      border-radius: 999px;
      color: white;
      background: #0077ed;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform .3s var(--ease), background .3s, box-shadow .3s;
    }

    .nav-button {
      padding: 7px 15px;
      font-size: 12px;
    }

    .nav-button:hover,
    .buy:hover {
      background: #2490f7;
      transform: scale(1.06);
      box-shadow: 0 10px 35px rgba(0,119,237,.42);
    }

    /* ОСНОВНЫЕ СЕКЦИИ */

    .section {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100vh;
      padding: 130px 24px 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -150px;
      left: 0;
      width: 100%;
      height: 300px;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,.1));
      filter: blur(30px);
    }

    .section::after {
      content: "";
      position: absolute;
      z-index: -1;
      bottom: -180px;
      left: -10%;
      width: 120%;
      height: 340px;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(124, 86, 255, .28) 0%,
        rgba(58, 65, 255, .1) 35%,
        transparent 70%
      );
      filter: blur(45px);
      opacity: .85;
    }

    .section-copy {
      position: relative;
      z-index: 5;
      width: min(100%, 920px);
      text-align: center;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h2 {
      margin-bottom: 14px;
      font-size: clamp(48px, 7vw, 102px);
      line-height: .93;
      letter-spacing: -.075em;
    }

    .section-copy p {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 25px);
      font-weight: 500;
      line-height: 1.18;
    }

    .reveal {
      opacity: 0;
      transform: translateY(50px) scale(.98);
      filter: blur(10px);
      transition:
        opacity 1.15s var(--ease),
        transform 1.15s var(--ease),
        filter 1.15s var(--ease);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    /* HERO */

    .hero {
      position: relative;
      min-height: 100vh;
      height: 980px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(circle at 50% 42%, #172e73 0%, #07102f 27%, #02040e 54%, #000 75%);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: min(86vw, 1100px);
      height: min(86vw, 1100px);
      top: 18%;
      left: 50%;
      border-radius: 50%;
      transform: translateX(-50%);
      background: conic-gradient(
        from 35deg,
        #4e00ff,
        #0ad6ff,
        #85a7ff,
        #ff4fd8,
        #4e00ff
      );
      filter: blur(95px);
      opacity: .46;
      animation: aura 11s linear infinite;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .24;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: linear-gradient(to bottom, transparent 18%, black 58%, transparent 95%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 18%, black 58%, transparent 95%);
      transform: perspective(800px) rotateX(64deg) translateY(250px) scale(1.8);
      transform-origin: center top;
    }

    .hero-copy {
      position: relative;
      z-index: 3;
      padding: 145px 20px 0;
      text-align: center;
      opacity: 0;
      transform: translateY(28px);
      animation: revealHero .9s .15s var(--ease) forwards;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: white;
      font-size: clamp(17px, 2vw, 21px);
      font-weight: 700;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(56px, 9vw, 118px);
      line-height: .92;
      letter-spacing: -.08em;
      background: linear-gradient(110deg, #fff 15%, #b6dcff 48%, #d6a5ff 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-copy p {
      margin: 0;
      color: #d9e5ff;
      font-size: clamp(19px, 2vw, 26px);
      font-weight: 500;
    }

    .phone-wrap {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: -130px;
      width: min(65vw, 610px);
      aspect-ratio: .5 / 1;
      transform: translateX(-50%) rotateX(6deg) rotateY(-18deg);
      transform-style: preserve-3d;
      opacity: 0;
      animation:
        phoneEnter 1.5s .35s var(--ease) forwards,
        phoneFloat 7s 2s ease-in-out infinite;
      filter: drop-shadow(-25px 45px 45px rgba(0,0,0,.7));
    }

    .phone {
      position: absolute;
      inset: 0;
      padding: clamp(7px, 1vw, 13px);
      border-radius: clamp(38px, 5vw, 78px);
      background:
        linear-gradient(115deg, #06080e 0%, #50618b 13%, #181c29 27%, #c3cbea 49%, #202839 62%, #06080b 100%);
      box-shadow:
        inset 3px 2px 3px rgba(255,255,255,.4),
        inset -4px -3px 6px rgba(0,0,0,.9),
        3px 5px 0 #5d6885,
        -7px 6px 0 #242b42;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: clamp(32px, 4.3vw, 67px);
      background:
        radial-gradient(circle at 48% 37%, #f2b3ff 0%, #9b4ff4 17%, transparent 38%),
        radial-gradient(circle at 80% 70%, #2c64ff 0%, transparent 35%),
        radial-gradient(circle at 25% 78%, #00f0da 0%, transparent 35%),
        linear-gradient(145deg, #09011c, #021a42 52%, #2e006d);
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(15px);
      mix-blend-mode: screen;
    }

    .screen::before {
      width: 90%;
      height: 45%;
      top: 15%;
      left: -16%;
      background: #ff4ad8;
      transform: rotate(-28deg);
      animation: blobOne 6s ease-in-out infinite alternate;
    }

    .screen::after {
      width: 105%;
      height: 50%;
      right: -38%;
      bottom: 7%;
      background: #00ddff;
      animation: blobTwo 8s ease-in-out infinite alternate;
    }

    .island {
      position: absolute;
      z-index: 3;
      top: 1.8%;
      left: 50%;
      width: 29%;
      height: 3.3%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #020205;
    }

    .reflection {
      position: absolute;
      z-index: 4;
      top: -15%;
      left: -46%;
      width: 44%;
      height: 125%;
      transform: rotate(24deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.22),
        rgba(255,255,255,.04),
        transparent
      );
      animation: reflection 7s ease-in-out infinite;
    }

    .scroll-indicator {
      position: absolute;
      z-index: 8;
      bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,.56);
      font-size: 11px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 38px;
      overflow: hidden;
      background: rgba(255,255,255,.18);
    }

    .scroll-line::after {
      content: "";
      display: block;
      width: 100%;
      height: 50%;
      background: #fff;
      animation: scrollLine 1.6s ease-in-out infinite;
    }

    /* CAMERA */

    .camera-section {
      min-height: 1080px;
      align-items: flex-start;
      background: #f5f5f7;
      color: #111;
    }

    .camera-section::after {
      background: radial-gradient(ellipse at center, rgba(43, 79, 195, .32), transparent 68%);
    }

    .camera-section .section-copy {
      padding-top: 22px;
    }

    .camera-section .section-copy p {
      color: #656569;
    }

    .camera-orb {
      position: absolute;
      width: min(100vw, 1000px);
      aspect-ratio: 1;
      bottom: -12%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 37% 31%, #f8efff 0 2%, transparent 2.5%),
        radial-gradient(circle at 43% 38%, #b9d7ff, #3e5488 14%, #17233f 32%, #060916 59%, #000 69%);
      box-shadow:
        0 0 0 19px #222634,
        0 0 0 25px #898e9e,
        0 0 0 32px #303443,
        0 0 100px 15px rgba(30,90,255,.3);
      transform: translateY(35%) rotate(-18deg);
      transition: transform 1.8s var(--ease);
    }

    .camera-orb.active {
      transform: translateY(12%) rotate(0deg);
    }

    .camera-orb::before {
      content: "";
      position: absolute;
      inset: 8%;
      border: 2px solid rgba(200,220,255,.24);
      border-radius: inherit;
      box-shadow: inset 0 0 90px rgba(84,102,255,.28);
    }

    .camera-orb::after {
      content: "";
      position: absolute;
      top: 14%;
      left: 19%;
      width: 23%;
      height: 9%;
      border-radius: 50%;
      transform: rotate(-35deg);
      background: rgba(255,255,255,.42);
      filter: blur(13px);
    }

    /* THIN */

    .thin-section {
      min-height: 1000px;
      background:
        radial-gradient(ellipse at 50% 105%, #203b71, transparent 43%),
        #050507;
    }

    .thin-section::after {
      background: radial-gradient(ellipse at center, rgba(60, 128, 255, .3), transparent 70%);
    }

    .thin-phone {
      position: absolute;
      width: min(66vw, 510px);
      height: min(110vw, 820px);
      bottom: -17%;
      border-radius: 58px;
      background:
        linear-gradient(100deg, #08090c 0%, #a7badc 2%, #1b202c 5%, #e7ecff 50%, #202737 96%, #697a9e 100%);
      transform: translateY(25%) rotate(61deg) skewY(-5deg);
      box-shadow:
        30px 45px 70px rgba(0,0,0,.75),
        inset 3px 3px 4px rgba(255,255,255,.55);
      transition: transform 1.5s var(--ease);
    }

    .thin-phone.active {
      transform: translateY(3%) rotate(61deg) skewY(-5deg);
    }

    .thin-phone::before {
      content: "";
      position: absolute;
      top: 4%;
      left: 3%;
      width: 94%;
      height: 92%;
      border-radius: 52px;
      background:
        linear-gradient(140deg, rgba(255,255,255,.34), transparent 10% 80%, rgba(255,255,255,.2)),
        #070a14;
    }

    /* DISPLAY */

    .display-section {
      min-height: 1000px;
      background: #000;
    }

    .display-section h2 {
      background: linear-gradient(100deg, #ff70d5, #ba95ff, #6fc8ff, #b3fff3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .light-world {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 45% 39%, rgba(255,83,208,.88), transparent 11%),
        radial-gradient(circle at 60% 51%, rgba(36,133,255,.82), transparent 17%),
        radial-gradient(circle at 38% 63%, rgba(33,255,209,.54), transparent 19%),
        #03000a;
    }

    .light-world::before {
      content: "";
      position: absolute;
      width: 130%;
      height: 50%;
      top: 25%;
      left: -15%;
      opacity: .24;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      filter: blur(45px);
      transform: rotate(-14deg);
      animation: beam 8s ease-in-out infinite alternate;
    }

    .rings {
      position: absolute;
      width: min(94vw, 1100px);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 50%;
      transform: translate(-50%, -21%) rotateX(71deg);
      box-shadow:
        0 0 70px rgba(145,50,255,.8),
        inset 0 0 70px rgba(29,221,255,.48);
      animation: rings 10s linear infinite;
    }

    .rings::before,
    .rings::after {
      content: "";
      position: absolute;
      inset: 15%;
      border: inherit;
      border-radius: inherit;
    }

    .rings::after {
      inset: 31%;
    }

    /* AI */

    .ai-section {
      min-height: 960px;
      background: #f5f5f7;
      color: #08080a;
    }

    .ai-section::after {
      background: radial-gradient(ellipse at center, rgba(145, 85, 255, .3), transparent 72%);
    }

    .ai-section p {
      color: #69696f;
    }

    .ai-section h2 {
      background: linear-gradient(105deg, #fa2459, #894bff 42%, #0077ff 72%, #00a978);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .neural {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: .96;
    }

    .neural span {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      animation: particle var(--d) ease-in-out infinite alternate;
    }

    .neural span:nth-child(1) {
      --d: 7s;
      width: 330px;
      height: 330px;
      top: 66%;
      left: 5%;
      background: #ff4ab8;
    }

    .neural span:nth-child(2) {
      --d: 9s;
      width: 450px;
      height: 450px;
      top: 52%;
      left: 57%;
      background: #7a50ff;
    }

    .neural span:nth-child(3) {
      --d: 8s;
      width: 250px;
      height: 250px;
      top: 12%;
      left: 68%;
      background: #00c9ff;
    }

    .neural span:nth-child(4) {
      --d: 6s;
      width: 180px;
      height: 180px;
      top: 25%;
      left: 16%;
      background: #ff8c42;
    }

    .neural::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle, transparent 42%, rgba(245,245,247,.16) 43%),
        linear-gradient(rgba(245,245,247,.87), rgba(245,245,247,.25));
      backdrop-filter: blur(55px);
    }

    /* ФИНАЛ */

    .final {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      text-align: center;
      background: #000;
    }

    .final-glow {
      position: absolute;
      width: min(80vw, 900px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(#3c00ff, #00d9ff, #ff32d2, #3c00ff);
      opacity: .42;
      filter: blur(110px);
      animation: auraFinal 13s linear infinite reverse;
    }

    .final-copy {
      position: relative;
      z-index: 3;
    }

    .final h2 {
      margin-bottom: 25px;
      color: white;
      font-size: clamp(62px, 12vw, 170px);
    }

    .final p {
      margin-bottom: 28px;
      color: #a1a1a6;
      font-size: 21px;
    }

    .buy {
      padding: 14px 25px;
      font-size: 17px;
    }

    /* СЛАЙД СОЗДАТЕЛЯ */

    .creator {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      background:
        radial-gradient(circle at 50% 48%, #161d68 0%, #090c29 30%, #000 70%);
      text-align: center;
    }

    .creator::before {
